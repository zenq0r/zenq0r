<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-label="zenqor-web — Official corporate website of Zenqor Technologies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0D1F38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C77A"/>
      <stop offset="100%" stop-color="#B8913F"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8913F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8C77A"/>
      <stop offset="100%" stop-color="#B8913F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="860" height="240" rx="12"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 3px; fill: #C9A95C; }
      .title   { font-size: 32px; font-weight: 700; fill: #F5F7FA; }
      .body    { font-size: 14.5px; fill: #9FB0C6; }
      .label   { font-size: 10px; font-weight: 600; letter-spacing: 2px; fill: #6B7F99; }
      .value   { font-size: 14px; font-weight: 600; fill: #E6ECF3; }
      .link    { font-size: 14px; font-weight: 600; fill: #E8C77A; }
      .a1 { opacity: 0; animation: fade .8s ease-out .05s forwards; }
      .a2 { opacity: 0; animation: fade .8s ease-out .25s forwards; }
      .a3 { opacity: 0; animation: fade .8s ease-out .45s forwards; }
      .a4 { opacity: 0; animation: fade .8s ease-out .65s forwards; }
      @keyframes fade { to { opacity: 1; } }
      .sweep { animation: sweep 7s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-860px); } 55%, 100% { transform: translateX(860px); } }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    </style>
  </defs>

  <!-- background -->
  <g clip-path="url(#card)">
    <rect width="860" height="240" fill="url(#bg)"/>
    <circle cx="820" cy="-40" r="220" fill="#1B3A63" opacity=".35"/>
    <circle cx="760" cy="260" r="140" fill="#12294A" opacity=".5"/>
    <rect class="sweep" width="860" height="240" fill="url(#shine)"/>
    <rect x="0" y="0" width="6" height="240" fill="url(#gold)"/>
  </g>
  <rect x=".5" y=".5" width="859" height="239" rx="12" fill="none" stroke="#22344F"/>

  <!-- monogram -->
  <g class="a1">
    <rect x="44" y="44" width="64" height="64" rx="10" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="76" y="88" text-anchor="middle" font-size="32" font-weight="700" fill="#E8C77A">Z</text>
  </g>

  <!-- left column -->
  <text x="136" y="60" class="eyebrow a1">FEATURED PROJECT</text>
  <text x="136" y="98" class="title a2">zenqor-web</text>
  <text x="136" y="128" class="body a3">Official corporate website of Zenqor Technologies — consulting,</text>
  <text x="136" y="148" class="body a3">licensing, compliance and digital systems for Malaysian businesses.</text>

  <g class="a4">
    <rect x="136" y="174" width="220" height="1" fill="url(#goldH)"/>
    <text x="136" y="202" class="link">www.zenqor.com.my  →</text>
  </g>

  <!-- divider -->
  <rect x="604" y="44" width="1" height="152" fill="#22344F"/>

  <!-- right column: key facts -->
  <g class="a3">
    <text x="632" y="60" class="label">STATUS</text>
    <circle cx="638" cy="79" r="4.5" fill="#3FB950" class="pulse"/>
    <text x="650" y="84" class="value">Live in production</text>

    <text x="632" y="118" class="label">STACK</text>
    <text x="632" y="140" class="value">HTML · CSS · JavaScript</text>

    <text x="632" y="174" class="label">REGISTERED</text>
    <text x="632" y="196" class="value">SSM 202603157897</text>
  </g>
</svg>
